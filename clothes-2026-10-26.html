 ""}, {"s": "Renuar", "br": "Renuar", "c": "שורטים", "n": "ברמודה קרגו ריזורט", "b": 199.9, "a": 129.9, "d": 35.0, "z": "L M S", "u": "https://www.renuar.co.il/products/415425309", "img": "https://cdn.shopify.com/s/files/1/0628/9676/7063/files/415425309-1.jpg?v=1782908048&width=400", "nw": "", "nwk": ""}];const CFG={"cols": [["img", "תמונה", "img"], ["s", "חנות", "text"], ["br", "מותג", "text"], ["c", "קטגוריה", "text"], ["n", "שם", "text"], ["b", "מחיר לפני", "num"], ["a", "מחיר אחרי", "num"], ["d", "% הנחה", "pct"], ["z", "מידות", "text"], ["u", "קישור", "link"]], "filters": [["s", "חנות"], ["br", "מותג"], ["c", "קטגוריה"]], "pk": "d", "nk": "n"};
const N=v=>String(v??'').normalize('NFC').trim();
const LK=(CFG.cols.find(c=>c[2]==='link')||[])[0];
const onlynew=document.getElementById('onlynew');
const qbox=document.getElementById('q');const TXT=R.map(r=>Object.values(r).map(v=>N(v)).join(' ').toLowerCase());
const tb=document.getElementById('tb'),hd=document.getElementById('hd'),cnt=document.getElementById('cnt'),md=document.getElementById('md');
// header
CFG.cols.forEach(([k,l,kind])=>{const th=document.createElement('th');th.textContent=l;if(kind!=='link'&&kind!=='img')th.dataset.k=k;if(kind==='img')th.className='im';hd.appendChild(th);});
// rows (built once; filter values in data-f-<key>)
const TR=R.map((r,i)=>{const tr=document.createElement('tr');tr.dataset.i=i;if(r.nwk)tr.dataset.nw=r.nwk;
  CFG.filters.forEach(([k])=>tr.setAttribute('data-f-'+k,N(r[k])));
  CFG.cols.forEach(([k,l,kind])=>{const td=document.createElement('td');
    if(kind==='link'){const a=document.createElement('a');a.href=r[k];a.target='_blank';a.textContent='לפריט';td.appendChild(a);}
    else if(kind==='img'){td.className='im';const u=String(r[k]??'').trim();
      if(/^https?:\/\//i.test(u)){const a=document.createElement('a');if(LK&&r[LK])a.href=r[LK];a.target='_blank';
        const im=document.createElement('img');im.loading='lazy';im.decoding='async';im.width=64;im.height=64;im.alt='';/* aspect hint only; CSS sizes it */
        im.referrerPolicy='no-referrer';im.style.objectFit='contain';im.onerror=()=>a.remove();im.src=u;
        a.appendChild(im);td.appendChild(a);}}
    else td.textContent=kind==='pct'?(r[k]+'%'):(r[k]??'');
    if(k===CFG.nk&&r.nw){const b=document.createElement('span');b.className='nb'+(r.nwk==='price'?' pr':'');b.textContent=r.nw;td.prepend(b);}
    tr.appendChild(td);});
  tb.appendChild(tr);return tr;});
// filter groups
const F=document.getElementById('filters');
CFG.filters.forEach(([k,label])=>{
  const fs=document.createElement('fieldset');fs.dataset.group=k;
  const lg=document.createElement('legend');lg.textContent=label;fs.appendChild(lg);
  // 22.10.2026: nothing checked = whole group shown; checking values = show only those (a click SELECTS, never removes)
  const none=document.createElement('button');none.type='button';none.className='gbtn';none.textContent='הצג הכל';none.dataset.act='none';
  fs.appendChild(none);
  const box=document.createElement('div');box.className='opts';fs.appendChild(box);
  const counts=new Map();R.forEach(r=>{const v=N(r[k]);counts.set(v,(counts.get(v)||0)+1);});
  [...counts.keys()].sort((a,b)=>a.localeCompare(b,'he')).forEach(v=>{
    const lab=document.createElement('label');const cb=document.createElement('input');
    cb.type='checkbox';cb.checked=false;cb.dataset.group=k;cb.value=v;
    lab.appendChild(cb);const sp=document.createElement('span');sp.textContent=' '+v+' ('+counts.get(v)+')';lab.appendChild(sp);lab.dataset.v=v;box.appendChild(lab);});
  none.onclick=()=>{box.querySelectorAll('input').forEach(c=>c.checked=false);draw();};
  F.appendChild(fs);});
function draw(){
  const on={};CFG.filters.forEach(([k])=>on[k]=new Set());
  document.querySelectorAll('#filters input[type=checkbox]').forEach(c=>{if(c.checked)on[c.dataset.group].add(N(c.value));});
  const m=parseFloat(md.value)||0;let shown=0;const qv=N(qbox.value).toLowerCase();
  const base=R.map((r,i)=>(+r[CFG.pk]||0)>=m&&!(onlynew&&onlynew.checked&&!r.nw)&&(!qv||TXT[i].includes(qv)));
  TR.forEach(tr=>{const r=R[+tr.dataset.i];
    // AND across groups, OR within a group, exact match on normalised value
    const ok=base[+tr.dataset.i]&&CFG.filters.every(([k])=>!on[k].size||on[k].has(tr.getAttribute('data-f-'+k)));
    tr.hidden=!ok;if(ok)shown++;});
  // cascading facets (22.10.2026): each group lists only values present among rows matching all OTHER groups (+min%/new);
  // a group with nothing checked is ignored for the other groups' counts
  const act=CFG.filters.map(([k])=>k).filter(k=>on[k].size>0);
  CFG.filters.forEach(([k])=>{const cnts=new Map();
    TR.forEach(tr=>{const i=+tr.dataset.i;if(!base[i])return;if(!act.every(g=>g===k||on[g].has(tr.getAttribute('data-f-'+g))))return;
      const v=tr.getAttribute('data-f-'+k);cnts.set(v,(cnts.get(v)||0)+1);});
    document.querySelectorAll('#filters fieldset[data-group="'+CSS.escape(k)+'"] label').forEach(lab=>{const c=cnts.get(lab.dataset.v)||0;
      lab.hidden=c===0&&!lab.firstChild.checked;lab.lastChild.textContent=' '+lab.dataset.v+' ('+c+')';});});
  if(onlynew){const b2=R.map((r,i)=>(+r[CFG.pk]||0)>=m&&(!qv||TXT[i].includes(qv)));let nn=0;
    TR.forEach(tr=>{const i=+tr.dataset.i;if(b2[i]&&R[i].nw&&CFG.filters.every(([k])=>!on[k].size||on[k].has(tr.getAttribute('data-f-'+k))))nn++;});
    onlynew.parentNode.lastChild.textContent=' רק חדש ('+nn+')';}
  cnt.textContent='מוצגים '+shown+' מתוך '+R.length+' פריטים';cnt.dataset.shown=shown;
}
let sk=null,sd=1;
hd.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{if(Date.now()-dragT<500)return;sd=sk===th.dataset.k?-sd:1;sk=th.dataset.k;
  TR.slice().sort((x,y)=>{const a=R[+x.dataset.i][sk],b=R[+y.dataset.i][sk];
    if(typeof a==='number'&&typeof b==='number')return(a-b)*sd;return String(a).localeCompare(String(b),'he')*sd;}).forEach(tr=>tb.appendChild(tr));});

// column widths: drag handle on each header's inline-end edge (Pointer Events: mouse + touch), persisted per report kind
const RTL=getComputedStyle(hd).direction==='rtl',IK=(CFG.cols.find(c=>c[2]==='img')||[])[0],IMW=72;
const WK=k=>'rw:'+location.pathname.replace(/\d{4}-\d\d-\d\d/,'')+':'+k;
const LS={get:k=>{try{return localStorage.getItem(WK(k));}catch(e){return null;}},
  set:(k,v)=>{try{v==null?localStorage.removeItem(WK(k)):localStorage.setItem(WK(k),String(v));}catch(e){}}};
const TH={},isl=document.getElementById('isl');let dragT=0;
function setW(k,w,save,lo){const th=TH[k];if(!th)return;const isI=k===IK;
  // lo: the drag's start width, so a column already wider than the cap never snaps narrower
  if(w!=null)w=Math.round(Math.max(40,Math.min(Math.max(isI?420:1200,lo||0),w)));
  if(isI){if(w==null)tb.parentNode.style.removeProperty('--imw');else tb.parentNode.style.setProperty('--imw',w+'px');
    isl.value=w==null?IMW:w;}
  else th.style.width=th.style.minWidth=w==null?'':w+'px';
  if(save)LS.set(k,w);}
CFG.cols.forEach(([k],i)=>{const th=hd.children[i];TH[k]=th;
  const h=document.createElement('span');h.className='rz';h.title='גרירה לשינוי רוחב, לחיצה כפולה לאיפוס';th.appendChild(h);
  let sx=0,sw=0,cur=null,on=false;
  h.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();on=true;cur=null;sx=e.clientX;
    sw=th.getBoundingClientRect().width;try{h.setPointerCapture(e.pointerId);}catch(_){}});
  h.addEventListener('pointermove',e=>{if(!on)return;const dx=e.clientX-sx;if(cur==null&&Math.abs(dx)<3)return;
    cur=sw+(RTL?-dx:dx);setW(k,cur,false,sw);});
  const end=()=>{if(!on)return;on=false;if(cur!=null){dragT=Date.now();setW(k,cur,true,sw);}};
  h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);h.addEventListener('lostpointercapture',end);
  h.addEventListener('click',e=>e.stopPropagation());
  h.addEventListener('dblclick',e=>{e.stopPropagation();dragT=Date.now();setW(k,null,true);});
  const v=parseFloat(LS.get(k));if(v>0)setW(k,v,false,v);});
document.getElementById('rwreset').onclick=()=>CFG.cols.forEach(([k])=>setW(k,null,true));
if(IK){document.getElementById('imctl').hidden=false;
  isl.addEventListener('input',()=>setW(IK,+isl.value,true));
  document.querySelectorAll('#imctl button[data-px]').forEach(b=>b.onclick=()=>setW(IK,+b.dataset.px,true));}

const dr=e=>{if(!(e.target.closest&&e.target.closest('#tools')))draw();};
document.addEventListener('change',dr);document.addEventListener('input',dr);
draw();
