    document.querySelectorAll('#filters fieldset[data-group="'+CSS.escape(k)+'"] label').forEach(lab=>{const c=cnts.get(lab.dataset.v)||0;
      lab.hidden=c===0&&!lab.firstChild.checked;lab.lastChild.textContent=' '+lab.dataset.v+' ('+c+')';});});
  if(onlynew){const b2=R.map((r,i)=>(+r[CFG.pk]||0)>=m&&(!qv||TXT[i].includes(qv)));let nn=0;
    TR.forEach(tr=>{const i=+tr.dataset.i;if(b2[i]&&R[i].nw&&CFG.filters.every(([k])=>!on[k].size||on[k].has(tr.getAttribute('data-f-'+k))))nn++;});
    onlynew.parentNode.lastChild.textContent=' רק חדש ('+nn+')';}
  cnt.textContent='מוצגים '+shown+' מתוך '+R.length+' פריטים';cnt.dataset.shown=shown;
}
let sk=null,sd=1;
hd.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{if(Date.now()-dragT<500)return;sd=sk===th.dataset.k?-sd:1;sk=th.dataset.k;
  TR.slice().sort((x,y)=>{const a=R[+x.dataset.i][sk],b=R[+y.dataset.i][sk];
    if(typeof a==='number'&&typeof b==='number')return(a-b)*sd;return String(a).localeCompare(String(b),'he')*sd;}).forEach(tr=>tb.appendChild(tr));});

// column widths: drag handle on each header's inline-end edge (Pointer Events: mouse + touch), persisted per report kind
const RTL=getComputedStyle(hd).direction==='rtl',IK=(CFG.cols.find(c=>c[2]==='img')||[])[0],IMW=72;
const WK=k=>'rw:'+location.pathname.replace(/\d{4}-\d\d-\d\d/,'')+':'+k;
const LS={get:k=>{try{return localStorage.getItem(WK(k));}catch(e){return null;}},
  set:(k,v)=>{try{v==null?localStorage.removeItem(WK(k)):localStorage.setItem(WK(k),String(v));}catch(e){}}};
const TH={},isl=document.getElementById('isl');let dragT=0;
function setW(k,w,save,lo){const th=TH[k];if(!th)return;const isI=k===IK;
  // lo: the drag's start width, so a column already wider than the cap never snaps narrower
  if(w!=null)w=Math.round(Math.max(40,Math.min(Math.max(isI?420:1200,lo||0),w)));
  if(isI){if(w==null)tb.parentNode.style.removeProperty('--imw');else tb.parentNode.style.setProperty('--imw',w+'px');
    isl.value=w==null?IMW:w;}
  else th.style.width=th.style.minWidth=w==null?'':w+'px';
  if(save)LS.set(k,w);}
CFG.cols.forEach(([k],i)=>{const th=hd.children[i];TH[k]=th;
  const h=document.createElement('span');h.className='rz';h.title='גרירה לשינוי רוחב, לחיצה כפולה לאיפוס';th.appendChild(h);
  let sx=0,sw=0,cur=null,on=false;
  h.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();on=true;cur=null;sx=e.clientX;
    sw=th.getBoundingClientRect().width;try{h.setPointerCapture(e.pointerId);}catch(_){}});
  h.addEventListener('pointermove',e=>{if(!on)return;const dx=e.clientX-sx;if(cur==null&&Math.abs(dx)<3)return;
    cur=sw+(RTL?-dx:dx);setW(k,cur,false,sw);});
  const end=()=>{if(!on)return;on=false;if(cur!=null){dragT=Date.now();setW(k,cur,true,sw);}};
  h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);h.addEventListener('lostpointercapture',end);
  h.addEventListener('click',e=>e.stopPropagation());
  h.addEventListener('dblclick',e=>{e.stopPropagation();dragT=Date.now();setW(k,null,true);});
  const v=parseFloat(LS.get(k));if(v>0)setW(k,v,false,v);});
document.getElementById('rwreset').onclick=()=>CFG.cols.forEach(([k])=>setW(k,null,true));
if(IK){document.getElementById('imctl').hidden=false;
  isl.addEventListener('input',()=>setW(IK,+isl.value,true));
  document.querySelectorAll('#imctl button[data-px]').forEach(b=>b.onclick=()=>setW(IK,+b.dataset.px,true));}

const dr=e=>{if(!(e.target.closest&&e.target.closest('#tools')))draw();};
document.addEventListener('change',dr);document.addEventListener('input',dr);
draw();
</script></html>
